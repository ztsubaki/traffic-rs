[package]
name = "traffic-rs"
version = "0.1.1"
edition = "2024"
links = "libsumo-bridge"

[dependencies]
toml = "0.5.6"
lazy_static = "1.5.0"
serde = {version="1.0.229",features=["derive"]}
clap = {version="4.6.6",features=["derive"]}
log = "0.4.33"
env_logger = "0.11.11"
libc = "0.2.189"
rand = "0.10.2"
rand_distr = "0.6.0"
pyo3 = "0.29.2"
tokio = {version="1.53.1",features=["full"]}
axum = "0.8.9"
futures = "0.3.34"
tokio-stream = "0.1.19"
chrono = "0.4.45"
sysinfo = "0.39.6"

[build-dependencies]
cc = "1.4.3"
